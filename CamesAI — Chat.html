.ib:hover{background:var(--hover);color:var(--text)}
.sp{flex:1}
/* sidebar */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.side{position:fixed;top:0;bottom:0;left:0;width:min(86vw,288px);z-index:30;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);transition:transform .25s ease}
.menu-open .side{transform:none}.menu-open .scrim{opacity:1;pointer-events:auto}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px 6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand b{color:var(--brand);font-weight:700}
.newchat{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px;border-radius:10px;font-weight:600;font-size:14.5px}
.newchat:hover{background:var(--hover)}
.hist-l{font-size:12.5px;font-weight:600;color:var(--muted);margin:16px 10px 4px}
.hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.hi{display:flex;align-items:center;gap:4px;min-height:40px;padding:0 4px 0 10px;border-radius:10px;font-size:14.5px;cursor:pointer}
.hi:hover,.hi.on{background:var(--hover)}.hi.on{font-weight:600}
.hi span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi .ib{width:32px;height:32px;opacity:0}.hi:hover .ib,.hi.on .ib{opacity:1}
@media (hover:none){.hi .ib{opacity:1}}
.empty-h{padding:8px 10px;font-size:13.5px;color:var(--muted)}
.side-foot{font-size:12px;color:var(--muted);padding:6px 10px 0}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:6px;height:56px;padding:0 10px;flex-shrink:0}
.mwrap{position:relative}
.mbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px 0 12px;border-radius:10px;font-weight:700;font-size:16px}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:var(--hover)}
.mbtn em{font-style:normal;font-weight:500;font-size:14px;color:var(--muted)}
.mbtn svg{color:var(--muted)}
.pop{position:absolute;z-index:15;background:var(--comp);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:6px;animation:pin .12s ease-out}
@keyframes pin{from{opacity:0}to{opacity:1}}
.mpop{top:calc(100% + 6px);left:0;width:min(320px,88vw)}
.pop-l{font-size:12.5px;font-weight:600;color:var(--muted);margin:8px 10px 4px}
.mopt{display:flex;flex-direction:column;width:100%;padding:9px 12px;border-radius:10px;position:relative}
.mopt:hover{background:var(--hover)}.mopt b{font-size:15px}.mopt small{font-size:12.5px;color:var(--muted)}
.mopt.on::after,.pi.on::after{content:"";position:absolute;right:16px;top:50%;width:6px;height:11px;margin-top:-8px;border-right:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:rotate(45deg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 4px 4px}
.seg button{display:flex;flex-direction:column;padding:9px 12px;border-radius:10px;border:1px solid var(--line)}
.seg button b{display:flex;align-items:center;gap:6px;font-size:14.5px}.seg small{font-size:12.5px;color:var(--muted)}
.seg button:hover{background:var(--hover)}.seg button.on{border-color:var(--brand);background:var(--tint)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.thread{max-width:760px;margin:0 auto;padding:8px 18px 24px;min-height:100%;display:flex;flex-direction:column;gap:24px}
.hello{margin:auto;text-align:center;padding:24px 0 72px}
.hello .lg{margin:0 auto}
.hello h1{margin:16px 0 0;font-size:1.75rem;font-weight:600;line-height:1.3}
.msg.user{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bub{background:var(--bubble);padding:10px 16px;border-radius:18px;max-width:84%;white-space:pre-wrap;overflow-wrap:anywhere}
.atts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:84%}
.atts span{font-size:12.5px;padding:3px 10px;border-radius:8px;border:1px solid var(--line);color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.ai{display:flex;gap:12px;align-items:flex-start}
.av{width:28px;height:28px;flex-shrink:0;margin-top:1px}
.ai-b{flex:1;min-width:0}
.by{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.md{overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.65em 0}.md ul,.md ol{margin:.6em 0;padding-left:1.4em}.md li{margin:.25em 0}
.md h2,.md h3,.md h4,.md h5{margin:1.1em 0 .4em;line-height:1.3}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--bubble);padding:2px 6px;border-radius:5px}
.code{margin:.8em 0;border-radius:10px;overflow:hidden;background:var(--codebg);color:#dbe1ec}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:5px 8px 5px 14px;font-size:12px;color:#98a1b3;background:rgba(255,255,255,.06)}
.code-h button{font-size:12px;padding:5px 10px;border-radius:6px;color:#c5cde0}.code-h button:hover{background:rgba(255,255,255,.1)}
.code pre{margin:0;padding:14px;overflow-x:auto}
.code code{background:none;padding:0;color:inherit;font-size:13px;line-height:1.6}
.mm{overflow-x:auto;padding:14px;border:1px solid var(--line);border-radius:12px}
.mm svg{display:block;font-family:var(--font)}
.mm .ml{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.5}
.mm .m0{fill:var(--brand)}.mm .m1{fill:var(--bubble)}.mm .m2{fill:none;stroke:var(--line);stroke-width:1.5}
.mm .t0{fill:#fff;font-weight:700;font-size:13px}.mm .t1{fill:var(--text);font-weight:600;font-size:13px}.mm .t2{fill:var(--text);font-size:12.5px}
.gen{display:block;width:100%;max-width:560px;border-radius:12px;border:1px solid var(--line);background:#fff}
.acts{display:flex;gap:2px;margin-top:4px;margin-left:-8px}
.acts .ib{width:32px;height:32px}
.dots{display:inline-flex;gap:5px;padding:8px 0;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.lbl{margin-left:10px;font-size:13.5px;color:var(--muted)}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* composer */
.dock{padding:6px 14px 12px;flex-shrink:0}
.cw{max-width:760px;margin:0 auto;position:relative}
.comp{border:1px solid var(--line);border-radius:24px;background:var(--comp);box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px 10px 8px 14px}
.comp:focus-within{border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 4px 8px 0}
.chip{display:flex;align-items:center;gap:8px;max-width:210px;height:40px;padding:0 6px 0 8px;border-radius:10px;border:1px solid var(--line);font-size:13px}
.chip img{width:28px;height:28px;border-radius:6px;object-fit:cover}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;color:var(--muted)}.chip button:hover{background:var(--hover);color:var(--text)}
textarea{display:block;width:100%;border:0;outline:0;resize:none;background:none;color:var(--text);font:inherit;font-size:16px;line-height:1.5;max-height:200px;padding:4px 4px 4px 0}

.pl{border-radius:50%;width:36px;height:36px}.pl svg{transition:transform .15s}.pl[aria-expanded="true"] svg{transform:rotate(45deg)}

.tc{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:99px;font-size:13px;font-weight:600;color:var(--brand);background:var(--tint);white-space:nowrap}
.send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0;background:var(--brand)}
.send:hover{filter:brightness(1.1)}.send:disabled{opacity:.3;cursor:default;filter:none}
.plus{left:0;bottom:calc(100% + 8px);width:min(310px,calc(100vw - 28px))}
.pi{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:6px 38px 6px 12px;border-radius:10px;position:relative}
.pi:hover{background:var(--hover)}
.pi .pic{display:grid;place-items:center;width:24px;color:var(--muted);flex-shrink:0}.pi.on .pic{color:var(--brand)}
.pi .pt{flex:1;min-width:0;line-height:1.3}.pi b{display:block;font-size:14.5px;font-weight:600}.pi small{display:block;font-size:12.5px;color:var(--muted)}
.pi.dis{opacity:.55}.pi .tag{font-size:12px;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:6px 8px}
.note{max-width:760px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:min(92vw,420px);padding:10px 16px;border-radius:10px;background:var(--codebg);color:#fff;font-size:13.5px;animation:pin .15s ease-out}
@media (min-width:861px){
.side{position:static;transform:none;width:270px;flex-shrink:0;z-index:auto}
.scrim,.menu,#closeSide{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<div class="app" id="app">
<div class="scrim" id="scrim"></div>
<aside class="side" id="side" aria-label="Riwayat chat">
  <div class="side-top">
    <div class="brand"><i class="lg" aria-hidden="true"></i><span>Cames<b>AI</b></span></div>
    <button class="ib" id="closeSide" data-ic="x" aria-label="Tutup menu"></button>
  </div>
  <button class="newchat" id="newChat" data-ic="plus">Chat baru</button>
  <div class="hist-l">Riwayat</div>
  <nav class="hist" id="hist"></nav>
  <div class="side-foot">Riwayat tersimpan di perangkat ini.</div>
</aside>
<main class="main">
  <header class="top">
    <button class="ib menu" id="menu" data-ic="menu" aria-label="Buka menu"></button>
    <div class="mwrap">
      <button class="mbtn" id="mbtn" aria-haspopup="true" aria-expanded="false"><span id="mname">Moca</span><em id="mmode">Light</em></button>
      <div class="pop mpop" id="mpop" hidden>
        <div class="pop-l">Model</div>
        <button class="mopt" data-m="clay"><b>Clay</b><small>Versi biasa · pas untuk tanya-jawab harian</small></button>
        <button class="mopt" data-m="moca"><b>Moca</b><small>Versi pintar · untuk tugas yang lebih rumit</small></button>
        <div class="pop-l">Mode</div>
        <div class="seg">
          <button data-mode="light"><b id="mLight">Light</b><small>Cepat</small></button>
          <button data-mode="power"><b id="mPower">Power</b><small>Lebih pintar</small></button>
        </div>
      </div>
    </div>
    <div class="sp"></div>
    <button class="ib" id="theme" aria-label="Ganti tema"></button>
  </header>
  <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
  <div class="dock">
    <div class="cw">
      <div class="pop plus" id="plus" hidden></div>
      <div class="comp">
        <div class="chips" id="chips" hidden></div>
        <textarea id="inp" rows="1" placeholder="Tulis pesan…" aria-label="Pesan"></textarea>
        <div class="bar">
          <button class="ib pl" id="plusBtn" aria-label="Tambah" aria-haspopup="true" aria-expanded="false"></button>
          <div class="tchips" id="tchips"></div>
          <div class="sp"></div>
          <button class="send" id="send" aria-label="Kirim"></button>
        </div>
      </div>
    </div>
    <p class="note" id="note">CamesAI bisa keliru. Periksa kembali info penting.</p>
  </div>
</main>
</div>

  var W=X[Wd.length-1]+Wd[Wd.length-1]+16,H=rows*44+16;
  (function dr(n){
    var x=X[n.dep]+8,y=n.y*44+30,sx=x+n.w,c=Math.min(n.dep,2);
    n.k.forEach(function(k){var x2=X[k.dep]+8,y2=k.y*44+30,mx=(sx+x2)/2;p+='<path d="M'+sx+' '+y+'C'+mx+' '+y+' '+mx+' '+y2+' '+x2+' '+y2+'"/>';dr(k)});
    q+='<rect class="m'+c+'" x="'+x+'" y="'+(y-16)+'" width="'+n.w+'" height="32" rx="9"/><text class="t'+c+'" x="'+(x+n.w/2)+'" y="'+(y+4.5)+'" text-anchor="middle">'+esc(n.t)+'</text>';
  })(d);
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mindmap"><g class="ml">'+p+'</g>'+q+'</svg>';
}

/* isi pesan */
function busyH(t){return '<span class="dots"><i></i><i></i><i></i></span>'+(t?'<span class="lbl">'+t+'</span>':'')}
function body(m,live){
  var t=m.content==='Thinking...'?'':m.content;
  if(m.kind==='mindmap'){if(live||!t)return busyH('Menyusun mindmap…');var d=pj(t);return d?'<div class="mm">'+mm(d)+'</div>':md(t)}
  if(m.kind==='image'){
    if(live||!t)return busyH('Menggambar…');
    var s=(t.match(/<svg[\s\S]*<\/svg>/i)||[])[0];
    if(!s)return md(t);
    if(!/xmlns=/.test(s))s=s.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');
    return '<img class="gen" alt="Gambar hasil" src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)+'">';
  }
  if(!t)return busyH(m.deep?'Berpikir mendalam…':'');
  return md(t);
}
function paint(el,m,live){el.innerHTML=body(m,live)}
function copyText(t,b){
  var done=function(){var h=b.innerHTML;b.innerHTML=b.hasAttribute('data-copy')?'Tersalin':ic(IC.check);setTimeout(function(){b.innerHTML=h},1200)};
  var fb=function(){try{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done()}catch(e){}};
  try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}
}

/* tampilan */
var thread=$('#thread'),scroll=$('#scroll'),inp=$('#inp'),sendBtn=$('#send');
function renderThread(){
  var c=cur();thread.innerHTML='';
  if(!c||!c.msgs.length){
    thread.innerHTML='<div class="hello"><i class="lg" style="width:56px;height:56px"></i><h1>Mau mulai dari mana?</h1></div>';
    return;
  }
  c.msgs.forEach(function(m,i){
    var d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'ai');d.dataset.i=i;
    if(m.role==='user'){
      if(m.att&&m.att.length){var r=document.createElement('div');r.className='atts';m.att.forEach(function(a){var s=document.createElement('span');s.textContent=a.n;r.appendChild(s)});d.appendChild(r)}
      var b=document.createElement('div');b.className='bub';b.textContent=m.content;d.appendChild(b);
    }else{
      d.innerHTML='<div class="av"><i class="lg" style="width:30px;height:30px"></i></div><div class="ai-b"><div class="by"></div><div class="md"></div></div>';
      d.querySelector('.by').textContent=m.by||'CamesAI';
      var last=i===c.msgs.length-1;
      paint(d.querySelector('.md'),m,busy&&last);
      if(!(busy&&last)){
        var a=document.createElement('div');a.className='acts';
        a.innerHTML=(m.kind?'':'<button type="button" class="ib" data-act="copy" aria-label="Salin">'+ic(IC.copy)+'</button>')+(last?'<button type="button" class="ib" data-act="regen" aria-label="Buat ulang">'+ic(IC.redo)+'</button>':'');
        d.querySelector('.ai-b').appendChild(a);
      }
    }
    thread.appendChild(d);
  });
  scroll.scrollTop=scroll.scrollHeight;
}
function renderList(){
  var l=$('#hist');l.innerHTML='';
  if(!chats.length){l.innerHTML='<div class="empty-h">Belum ada percakapan.</div>';return}
  chats.forEach(function(c){
    var r=document.createElement('div');r.className='hi'+(c.id===curId?' on':'');r.dataset.id=c.id;
    var s=document.createElement('span');s.textContent=c.title||'Chat baru';r.appendChild(s);
    var x=document.createElement('button');x.type='button';x.className='ib';x.dataset.del=c.id;x.setAttribute('aria-label','Hapus chat');x.innerHTML=ic(IC.trash);r.appendChild(x);
    l.appendChild(r);
  });
}
function setBtn(){
  sendBtn.innerHTML=ic(busy?IC.stop:IC.send);
  sendBtn.setAttribute('aria-label',busy?'Berhenti':'Kirim');
  sendBtn.disabled=!busy&&!inp.value.trim()&&!pend.length;
}
function newChat(){
  var c=cur();if(c&&!c.msgs.length){closeMenu();return c}
  c={id:'c'+Date.now(),title:'',msgs:[]};chats.unshift(c);curId=c.id;save();renderList();renderThread();closeMenu();return c;
}
function closeMenu(){$('#app').classList.remove('menu-open')}

/* model & mode */
function syncModel(){
  $('#mname').textContent=MODELS[st.model].name;$('#mmode').textContent=st.mode==='light'?'Light':'Power';
  document.querySelectorAll('.mopt').forEach(function(b){b.classList.toggle('on',b.dataset.m===st.model)});
  document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.mode===st.mode)});
  try{localStorage.setItem('camesai.model',JSON.stringify(st))}catch(e){}
}
$('#mbtn').addEventListener('click',function(){var h=$('#mpop').hidden;$('#mpop').hidden=!h;$('#plus').hidden=true;$('#mbtn').setAttribute('aria-expanded',String(h))});
$('#mpop').addEventListener('click',function(e){
  var m=e.target.closest('[data-m]'),d=e.target.closest('[data-mode]');
  if(m)st.model=m.dataset.m;if(d)st.mode=d.dataset.mode;
  if(m||d){syncModel();if(m){$('#mpop').hidden=true;$('#mbtn').setAttribute('aria-expanded','false')}}
});

/* menu + */
var ITEMS=[['photo','photo','Foto','Pilih dari galeri'],['cam','camera','Kamera','Ambil foto langsung'],['file','file','File','Teks, kode, CSV, JSON'],0,['mindmap','mind','Mindmap','Bikin mindmap dari topik'],['image','art','Gambar','Buat ilustrasi · otomatis terdeteksi'],['deep','brain','DeepThink','Berpikir lebih dalam dan teliti'],['browse','globe','Browse','Cari info terbaru di web',1]];
function buildPlus(){
  var h='';
  ITEMS.forEach(function(it){
    if(!it){h+='<div class="sep"></div>';return}
    h+='<button type="button" class="pi'+(tool[it[0]]?' on':'')+(it[4]?' dis':'')+'" data-k="'+it[0]+'"><span class="pic">'+ic(IC[it[1]],19)+'</span><span class="pt"><b>'+it[2]+'</b><small>'+it[3]+'</small></span>'+(it[4]?'<span class="tag">Segera</span>':'')+'</button>';
  });
  $('#plus').innerHTML=h;
}
function renderTools(){
  var t=$('#tchips');t.innerHTML='';
  [['mindmap','Mindmap','mind'],['image','Gambar','art'],['deep','DeepThink','brain']].forEach(function(k){
    if(!tool[k[0]])return;
    var b=document.createElement('button');b.type='button';b.className='tc';b.dataset.tool=k[0];b.setAttribute('aria-label','Matikan '+k[1]);
    b.innerHTML=ic(IC[k[2]],15)+'<span>'+k[1]+'</span>'+ic(IC.x,13);t.appendChild(b);
  });
  buildPlus();
}
function setPlus(open){$('#plus').hidden=!open;$('#plusBtn').setAttribute('aria-expanded',String(open));if(open){$('#mpop').hidden=true;$('#mbtn').setAttribute('aria-expanded','false')}}
$('#plusBtn').addEventListener('click',function(){setPlus($('#plus').hidden)});
$('#plus').addEventListener('click',function(e){
  var b=e.target.closest('[data-k]');if(!b)return;var k=b.dataset.k;
  if(k==='photo')$('#fPhoto').click();
  else if(k==='cam')$('#fCam').click();
  else if(k==='file')$('#fFile').click();
  else if(k==='browse'){toast('Browse butuh koneksi ke layanan pencarian, belum tersedia di pratinjau ini.')}
  else{tool[k]=!tool[k];if(tool[k]&&k==='mindmap')tool.image=false;if(tool[k]&&k==='image')tool.mindmap=false;renderTools()}
  setPlus(false);
});
$('#tchips').addEventListener('click',function(e){var b=e.target.closest('[data-tool]');if(b){tool[b.dataset.tool]=false;renderTools()}});
document.addEventListener('click',function(e){
  if(!e.target.closest('.mwrap')){$('#mpop').hidden=true;$('#mbtn').setAttribute('aria-expanded','false')}
  if(!e.target.closest('.cw'))setPlus(false);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeMenu();setPlus(false);$('#mpop').hidden=true}});

/* lampiran */
function addFiles(list,kind){
  Array.prototype.forEach.call(list,function(f){
    if(pend.length>=6){toast('Maksimal 6 lampiran.');return}
    var img=kind==='img'||f.type.indexOf('image/')===0;
    if(img){
      if(!canImg){toast('Lampiran gambar belum didukung di tampilan ini.');return}
      if(f.size>10e6){toast('Gambar terlalu besar (maks 10 MB).');return}
      pend.push({name:f.name||'foto.jpg',kind:'img',blob:f,url:URL.createObjectURL(f)});renderChips();return;
    }
    if(/\.(pdf|docx?|xlsx?|pptx?|zip|rar|7z)$/i.test(f.name)){toast('Format itu belum didukung. Pakai teks, kode, CSV, atau JSON.');return}
    if(f.size>2e6){toast('File terlalu besar (maks 2 MB).');return}
    f.text().then(function(t){pend.push({name:f.name,kind:'file',text:t.slice(0,20000)});renderChips()}).catch(function(){toast('File tidak bisa dibaca.')});
  });
}
[['#fPhoto','img'],['#fCam','img'],['#fFile','file']].forEach(function(a){
  $(a[0]).addEventListener('change',function(e){addFiles(e.target.files,a[1]);e.target.value=''});
});
function renderChips(){
  var c=$('#chips');c.innerHTML='';c.hidden=!pend.length;
  pend.forEach(function(p,i){
    var d=document.createElement('div');d.className='chip';
    if(p.kind==='img'){var im=document.createElement('img');im.src=p.url;im.alt='';d.appendChild(im)}else d.insertAdjacentHTML('beforeend',ic(IC.file,18));
    var s=document.createElement('span');s.textContent=p.name;d.appendChild(s);
    var x=document.createElement('button');x.type='button';x.dataset.rm=i;x.setAttribute('aria-label','Hapus lampiran');x.innerHTML=ic(IC.x,14);d.appendChild(x);
    c.appendChild(d);
  });
  setBtn();
}
$('#chips').addEventListener('click',function(e){var b=e.target.closest('[data-rm]');if(b){pend.splice(+b.dataset.rm,1);renderChips()}});

/* kirim ke AI */
function errMsg(e){return e&&e.code==='not_granted'?'Izin untuk memakai AI belum diberikan.':e&&e.code==='rate_limited'?'Terlalu banyak permintaan. Coba lagi sebentar.':'Gagal memproses permintaan. Coba lagi.'}
function sys(){var M=MODELS[st.model];return 'Kamu adalah '+M.name+', model AI dari CamesAI ('+M.desc+'). '+(st.mode==='light'?'Mode Light: jawab ringkas, cepat, langsung ke inti.':'Mode Power: jawab lebih mendalam, teliti, dan terstruktur.')+' Jawab dalam bahasa yang dipakai pengguna (utamanya Bahasa Indonesia). Gunakan Markdown seperlunya: daftar, **tebal**, dan blok kode dengan penanda bahasa.'}
function send(text){
  text=(text||'').trim();if(busy||(!text&&!pend.length))return;
  var c=cur()||newChat(),hasImg=pend.some(function(p){return p.kind==='img'});
  var kind=tool.mindmap?'mindmap':tool.image?'image':'';
  if(!kind&&!hasImg){
    if(/mind\s?map|peta pikiran/i.test(text))kind='mindmap';
    else if(/^(gambarkan|lukiskan)|(buat|gambar|lukis|desain)\w*\s.*(gambar|ilustrasi|logo|poster|lukisan|sketsa|ikon)/i.test(text))kind='image';
  }
  var u={id:uid(),role:'user',content:text||'Tolong jelaskan lampiran ini.'},fl=pend.filter(function(p){return p.kind==='file'});
  if(pend.length)u.att=pend.map(function(p){return{n:p.name,k:p.kind}});
  if(fl.length)u.ft=fl.map(function(f){return '\n\n[File: '+f.name+']\n'+f.text}).join('');
  if(hasImg)IMG[u.id]=pend.filter(function(p){return p.kind==='img'}).map(function(p){return p.blob});
  c.msgs.push(u);if(c.msgs.length===1)c.title=u.content.slice(0,40);
  var a={role:'assistant',content:'',kind:kind,deep:tool.deep,by:label()};c.msgs.push(a);
  pend=[];renderChips();tool.mindmap=false;tool.image=false;renderTools();
  inp.value='';grow();renderList();run(c,a);
}
function run(c,a){
  if(!sample){a.kind='';a.content='AI belum tersedia di tampilan ini.';save();renderThread();return}
  busy=true;setBtn();ctl=new AbortController();save();renderThread();
  var el=thread.querySelector('.msg.ai:last-child .md'),ms=c.msgs.slice(0,-1);
  var hist=ms.map(function(m){return{role:m.role,content:m.role==='user'?m.content+(m.ft||''):(m.kind?'['+KL[m.kind]+' sudah dibuat]':m.content)}});
  hist[0].content=sys()+'\n\n---\n\n'+hist[0].content;
  var L=hist[hist.length-1],tp=a.kind||(a.deep?'deep':'');if(tp)L.content+='\n\n'+TP[tp];
  var o={cache:false,signal:ctl.signal,modelTier:a.deep?'complex':TIER[st.model][st.mode],onText:function(r){
    a.content=r.text;if(el){var near=scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<120;paint(el,a,true);if(near)scroll.scrollTop=scroll.scrollHeight}
  }};
  var im=IMG[ms[ms.length-1].id];if(im&&im.length&&canImg)o.images=im;
  sample(hist,o).then(function(r){if(r&&r.text)a.content=r.text}).catch(function(e){
    if(!ctl||!ctl.signal.aborted){a.kind='';a.content=(a.content&&a.content!=='Thinking...'?a.content+'\n\n':'')+errMsg(e)}
  }).then(function(){
    if(a.content==='Thinking...')a.content='';
    busy=false;ctl=null;save();setBtn();renderThread();
  });
}
function regen(){
  var c=cur();if(!c||busy||!c.msgs.length)return;
  var o=c.msgs[c.msgs.length-1];if(o.role!=='assistant')return;
  c.msgs.pop();
  var a={role:'assistant',content:'',kind:o.kind||'',deep:o.deep,by:label()};c.msgs.push(a);run(c,a);
}

/* event */
function grow(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,200)+'px';setBtn()}
inp.addEventListener('input',grow);
inp.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&window.matchMedia('(pointer:fine)').matches){e.preventDefault();send(inp.value)}
});
sendBtn.addEventListener('click',function(){if(busy){if(ctl)ctl.abort()}else send(inp.value)});
thread.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-copy'))copyText(b.closest('.code').querySelector('code').textContent,b);
  else if(b.dataset.act==='copy')copyText(cur().msgs[+b.closest('.msg').dataset.i].content,b);
  else if(b.dataset.act==='regen')regen();
});
$('#hist').addEventListener('click',function(e){
  var d=e.target.closest('[data-del]');
  if(d){
    var id=d.dataset.del;chats=chats.filter(function(c){return c.id!==id});
    if(curId===id){curId=chats.length?chats[0].id:null;if(busy&&ctl)ctl.abort()}
    save();renderList();renderThread();return;
  }
  var r=e.target.closest('.hi');
  if(r&&!busy){curId=r.dataset.id;save();renderList();renderThread();closeMenu()}
});
$('#newChat').addEventListener('click',function(){if(!busy)newChat()});
$('#menu').addEventListener('click',function(){$('#app').classList.add('menu-open')});
$('#closeSide').addEventListener('click',closeMenu);
$('#scrim').addEventListener('click',closeMenu);

/* tema */
var tb=$('#theme');
function isDark(){var t=document.documentElement.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches}
function themeIcon(){tb.innerHTML=ic(isDark()?IC.sun:IC.moon)}
try{var th=localStorage.getItem('camesai.theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
tb.addEventListener('click',function(){var n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('camesai.theme',n)}catch(e){}themeIcon()});
themeIcon();

/* mulai */
load();if(!cur())curId=chats.length?chats[0].id:null;
syncModel();renderTools();renderList();renderThread();setBtn();
function noAI(){$('#note').textContent='AI belum tersedia di tampilan ini.'}
if(window.claude&&claude.use){
  claude.use('sample').then(function(s){
    sample=s;if(!s){noAI();return}
    if(s.limits)return s.limits().then(function(l){canImg=!!(l&&l.images)}).catch(function(){});
  }).catch(noAI);
}else noAI();
})();
</script>
</body>
